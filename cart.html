
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - RetailFlow</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar">

            <h2 class="logo">RetailFlow</h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#categories">Categories</a></li>
            </ul>

            <div class="nav-buttons">
                <a href="login.html">Login</a>
                <a href="wishlist.html">Wishlist</a>
            </div>

        </nav>
    </header>

    <!-- Cart Section -->
    <main>

        <section class="products-section">

            <div class="section-heading">
                <span>YOUR SHOPPING</span>
                <h2>My Shopping Cart</h2>
                <p>Review your selected products.</p>
            </div>

            <div id="cartContainer" class="products-container">

                <!-- Cart products will appear here -->

            </div>

            <div class="cart-summary">
                <h3>Order Summary</h3>

                <p>
                    Total:
                    <strong id="cartTotal">Rs. 0</strong>
                </p>

                <button id="checkoutBtn">Proceed to Checkout</button>

                <br><br>

                <a href="index.html">Continue Shopping</a>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>© 2026 RetailFlow. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../Javascript/cart.js"></script>

</body>
</html>
