
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RetailFlow</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">RetailFlow</h2>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-login-section">

        <div class="admin-login-box">
            <h2>Admin Login</h2>
            <p>Login to manage your store.</p>

            <form id="adminLoginForm">

                <label>Email Address</label>
                <input type="email" id="adminEmail" required>

                <label>Password</label>
                <input type="password" id="adminPassword" required>

                <button type="submit">Login as Admin</button>

            </form>
        </div>

    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>© 2026 RetailFlow. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../Javascript/admin-login.js"></script>
</body>
</html>
